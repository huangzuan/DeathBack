plugins {
    id 'fabric-loom' version '1.15.5'
}

base.archivesName = "modid"
version = '1.0'
group = 'com.yourname.modid'
actualmodid = 'death_back'

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = actualmodid + ".refmap.json"
    }

    if (file("src/main/resources/death_back.accesswidener").exists())
        accessWidenerPath = file("src/main/resources/death_back.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.20.1"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

apply from: 'mcreator.gradle'
